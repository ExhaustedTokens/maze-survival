# Toolchain in a container: no Node installed on Windows.
# Usage: docker compose run --rm tools npm ci
#        docker compose run --rm tools npm run check
services:
  tools:
    image: node:22-alpine
    working_dir: /app
    volumes:
      - .:/app
    environment:
      npm_config_update_notifier: 'false'
    command: npm run check
