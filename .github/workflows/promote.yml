name: promote

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target environment'
        required: true
        type: choice
        options: [staging, production]

concurrency:
  group: promote
  cancel-in-progress: false

permissions:
  contents: write
  checks: read
  actions: write

jobs:
  promote:
    name: promote
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve source and target branches
        id: refs
        env:
          TARGET: ${{ inputs.target }}
        run: |
          if [ "$TARGET" = "staging" ]; then FROM=dev; TO=staging; else FROM=staging; TO=main; fi
          git fetch origin "$FROM" "$TO"
          FROM_SHA=$(git rev-parse "origin/$FROM")
          TO_SHA=$(git rev-parse "origin/$TO")
          if [ "$FROM_SHA" = "$TO_SHA" ]; then
            echo "::notice::nothing to promote: $TO is already at $FROM ($TO_SHA)"
            SKIP=true
          elif ! git merge-base --is-ancestor "$TO_SHA" "$FROM_SHA"; then
            echo "::error::$TO has commits that are not in $FROM: history is not linear, realign manually (see docs/sviluppo.md §2)"
            exit 1
          else
            SKIP=false
          fi
          {
            echo "from=$FROM"
            echo "to=$TO"
            echo "sha=$FROM_SHA"
            echo "skip=$SKIP"
          } >> "$GITHUB_OUTPUT"

      - name: CI must be green on the commit being promoted
        if: steps.refs.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.refs.outputs.sha }}
        run: |
          CONCLUSION=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/check-runs?check_name=ci" \
            --jq '[.check_runs[] | select(.name == "ci")] | first | .conclusion // "missing"')
          echo "check 'ci' on ${SHA}: ${CONCLUSION}"
          [ "$CONCLUSION" = "success" ] || { echo "::error::CI is not green (${CONCLUSION}) on ${SHA}"; exit 1; }

      - name: Fast-forward
        if: steps.refs.outputs.skip == 'false'
        env:
          FROM_SHA: ${{ steps.refs.outputs.sha }}
          TO: ${{ steps.refs.outputs.to }}
        run: git push origin "${FROM_SHA}:refs/heads/${TO}"

      - name: Trigger release
        if: steps.refs.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TO: ${{ steps.refs.outputs.to }}
        run: gh workflow run release.yml --ref "$TO"
