name: promote

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Target environment'
        required: true
        type: choice
        options: [staging, production]

concurrency:
  group: promote
  cancel-in-progress: false

permissions:
  contents: write
  checks: read
  actions: write

jobs:
  promote:
    name: promote
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Fine-grained PAT of a repo admin (Contents: read/write on this repo only).
      # staging and main only accept pushes from bypass actors, and GitHub Actions cannot be one:
      # without this secret the fast-forward push is rejected by the ruleset (docs/sviluppo.md §7).
      PROMOTE_TOKEN: ${{ secrets.PROMOTE_TOKEN }}
    steps:
      - name: Choose the push token
        id: auth
        run: |
          if [ -n "$PROMOTE_TOKEN" ]; then
            echo "has_pat=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_pat=false" >> "$GITHUB_OUTPUT"
            echo "::warning::PROMOTE_TOKEN secret is missing: falling back to GITHUB_TOKEN, which the staging/main ruleset rejects (docs/sviluppo.md §7)"
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PROMOTE_TOKEN || github.token }}

      - name: Resolve source and target branches
        id: refs
        env:
          TARGET: ${{ inputs.target }}
        run: |
          if [ "$TARGET" = "staging" ]; then FROM=dev; TO=staging; else FROM=staging; TO=main; fi
          git fetch origin "$FROM" "$TO"
          FROM_SHA=$(git rev-parse "origin/$FROM")
          TO_SHA=$(git rev-parse "origin/$TO")
          if [ "$FROM_SHA" = "$TO_SHA" ]; then
            echo "::notice::nothing to promote: $TO is already at $FROM ($TO_SHA)"
            SKIP=true
          elif ! git merge-base --is-ancestor "$TO_SHA" "$FROM_SHA"; then
            echo "::error::$TO has commits that are not in $FROM: history is not linear, realign manually (see docs/sviluppo.md §2)"
            exit 1
          else
            SKIP=false
          fi
          {
            echo "from=$FROM"
            echo "to=$TO"
            echo "sha=$FROM_SHA"
            echo "skip=$SKIP"
          } >> "$GITHUB_OUTPUT"

      - name: CI must be green on the commit being promoted
        if: steps.refs.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ steps.refs.outputs.sha }}
        run: |
          FAILED=0
          for CHECK in lint test build; do
            CONCLUSION=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${SHA}/check-runs?check_name=${CHECK}" \
              --jq "[.check_runs[] | select(.name == \"${CHECK}\")] | first | .conclusion // \"missing\"")
            echo "check '${CHECK}' on ${SHA}: ${CONCLUSION}"
            [ "$CONCLUSION" = "success" ] || FAILED=1
          done
          [ "$FAILED" = "0" ] || { echo "::error::CI is not green on ${SHA}"; exit 1; }

      - name: Fast-forward
        if: steps.refs.outputs.skip == 'false'
        env:
          FROM_SHA: ${{ steps.refs.outputs.sha }}
          TO: ${{ steps.refs.outputs.to }}
        run: git push origin "${FROM_SHA}:refs/heads/${TO}"

      # A push made with a PAT already triggers the release workflow; GITHUB_TOKEN pushes do not.
      - name: Trigger release
        if: steps.refs.outputs.skip == 'false' && steps.auth.outputs.has_pat == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          TO: ${{ steps.refs.outputs.to }}
        run: gh workflow run release.yml --ref "$TO"
